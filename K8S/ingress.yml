---
# 1) Path-based routing with rewrite:
#    /nginx/foo  -> nginx  service receives /foo
#    /httpd/foo  -> httpd  service receives /foo
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: applications-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /nginx(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nginx
                port:
                  number: 80
          - path: /httpd(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: httpd
                port:
                  number: 80
---
# 2) Catch-all: anything else goes to nginx unchanged (no rewrite)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: applications-ingress-default
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
